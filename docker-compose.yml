services:
  postgres:
    image: postgres:16-alpine
    container_name: reviewmind-postgres
    environment:
      POSTGRES_USER: reviewmind
      POSTGRES_PASSWORD: reviewmind
      POSTGRES_DB: reviewmind
    ports:
      - "5432:5432"
    volumes:
      - reviewmind_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reviewmind-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  reviewmind_pg_data:
